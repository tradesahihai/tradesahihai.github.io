<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Sahi Hai - Intelligent Analytics Matrix</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        body { background: #0b0e14; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 0; }
        .tab-btn { background: #161b22; border: 1px solid #30363d; color: #8b949e; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; }
        .tab-btn.active { background: #21262d; border-color: #8b949e; color: #fff; }
        #news-feed-moneycontrol::-webkit-scrollbar, #news-feed-yahoofinance::-webkit-scrollbar { width: 4px; }
        #news-feed-moneycontrol::-webkit-scrollbar-thumb, #news-feed-yahoofinance::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- 📊 TOP WORKSPACE CALCULATION UTILITY BAR -->
    <div style="position: fixed !important; top: 0 !important; left: 0 !important; width: 100% !important; background: #0d1117 !important; border-bottom: 1px solid #30363d !important; padding: 0.4rem 0 !important; z-index: 999999 !important; box-shadow: 0 4px 15px rgba(0,0,0,0.6) !important;">
        <div style="max-width: 1400px; margin: 0 auto; padding: 0 1.5rem; width: 100%; box-sizing: border-box;">
            <div class="calculator-widget-card" style="width: 100%;">
                <div style="margin-bottom: 0.35rem; display: flex; justify-content: space-between; align-items: center;">
                    <h2 style="font-size: 0.8rem; margin: 0; color: #fff; font-weight: 600;">🧮 Portfolio Position Risk Calculator</h2>
                    <span style="background: #21262d; color: #8b949e; border: 1px solid #30363d; padding: 1px 6px; border-radius: 4px; font-size: 0.6rem; font-weight: 500;">Risk Utility Tool</span>
                </div>
                <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; margin-bottom: 0;">
                    <div class="form-element"><label style="display: block; font-size: 0.6rem; color: #8b949e; margin-bottom: 2px;">Trading Capital (₹)</label><input type="number" id="calc-capital" value="100000" style="width:100%; padding:0.25rem 0.4rem; background:#161b22; color:#fff; border:1px solid #30363d; border-radius:4px; font-size: 0.7rem; height: 24px; box-sizing: border-box; outline: none;"></div>
                    <div class="form-element"><label style="display: block; font-size: 0.6rem; color: #8b949e; margin-bottom: 2px;">Risk Tolerance (%)</label><input type="number" id="calc-risk-pct" value="1" style="width:100%; padding:0.25rem 0.4rem; background:#161b22; color:#fff; border:1px solid #30363d; border-radius:4px; font-size: 0.7rem; height: 24px; box-sizing: border-box; outline: none;"></div>
                    <div class="form-element"><label style="display: block; font-size: 0.6rem; color: #8b949e; margin-bottom: 2px;">Entry Price (₹)</label><input type="number" id="calc-entry" value="2500" style="width:100%; padding:0.25rem 0.4rem; background:#161b22; color:#fff; border:1px solid #30363d; border-radius:4px; font-size: 0.7rem; height: 24px; box-sizing: border-box; outline: none;"></div>
                    <div class="form-element"><label style="display: block; font-size: 0.6rem; color: #8b949e; margin-bottom: 2px;">Target Price (₹)</label><input type="number" id="calc-target" value="2600" style="width:100%; padding:0.25rem 0.4rem; background:#161b22; color:#fff; border:1px solid #30363d; border-radius:4px; font-size: 0.7rem; height: 24px; box-sizing: border-box; outline: none;"></div>
                    <div class="form-element"><label style="display: block; font-size: 0.6rem; color: #8b949e; margin-bottom: 2px;">Stop Loss (₹)</label><input type="number" id="calc-stop" value="2450" style="width:100%; padding:0.25rem 0.4rem; background:#161b22; color:#fff; border:1px solid #30363d; border-radius:4px; font-size: 0.7rem; height: 24px; box-sizing: border-box; outline: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab Bar Controller Headers Navigation -->
    <div style="max-width: 1400px; margin: 5.5rem auto 0 auto; padding: 0 1rem; display: flex; gap: 0.5rem;" id="tab-navigation-bar">
        <button class="tab-btn active" onclick="switchActiveTab(0, 'tab-daily-stream')">📊 Daily Inferences</button>
        <button class="tab-btn" onclick="switchActiveTab(1, 'tab-concept-learning')">💡 Learning Log</button>
    </div>

    <!-- Main Application Dashboard Workspace Split -->
    <div class="dashboard-split-wrapper" style="display: flex; gap: 1.25rem; max-width: 1400px; margin: 0 auto; padding: 1rem; box-sizing: border-box;">
        
        <!-- LEFT SIDE: 70% Matrix Core Container Feeds -->
        <div class="matrix-left-stream" style="flex: 0 0 70%; width: 70%; max-width: 70%; transition: all 0.25s ease;">
            <div id="stream-daily-container"></div>
            <div id="stream-learning-container"></div>
            <div id="stream-strategy-container"></div>
            <div id="stream-reels-container"></div>
        </div>

        <!-- RIGHT SIDE: 30% Live News Workspace -->
        <div id="news-sidebar-panel" style="flex: 0 0 30%; width: 30%; max-width: 30%; display: flex; flex-direction: column; gap: 1rem; transition: all 0.25s ease;">
            
            <div class="news-widget-box" style="background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; box-sizing: border-box;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; border-bottom: 1px solid #21262d; padding-bottom: 0.5rem;">
                    <h4 style="margin: 0; color: #fff; font-size: 0.85rem; font-weight: 600; font-family: monospace;">📰 MONEYCONTROL LIVE</h4>
                    <span style="background: #e65100; color: #fff; font-size: 0.55rem; font-weight: 700; padding: 1px 5px; border-radius: 3px;">BSE/NSE</span>
                </div>
                <div id="news-feed-moneycontrol" style="max-height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.6rem; padding-right: 2px;">
                    <div style="color: #8b949e; font-size: 0.75rem; font-family: monospace;">Connecting to stream...</div>
                </div>
            </div>

            <div class="news-widget-box" style="background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; box-sizing: border-box;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; border-bottom: 1px solid #21262d; padding-bottom: 0.5rem;">
                    <h4 style="margin: 0; color: #fff; font-size: 0.85rem; font-weight: 600; font-family: monospace;">🚀 YAHOO FINANCE</h4>
                    <span style="background: #2962ff; color: #fff; font-size: 0.55rem; font-weight: 700; padding: 1px 5px; border-radius: 3px;">GLOBAL</span>
                </div>
                <div id="news-feed-yahoofinance" style="max-height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.6rem; padding-right: 2px;">
                    <div style="color: #8b949e; font-size: 0.75rem; font-family: monospace;">Connecting to stream...</div>
                </div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
