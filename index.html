<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Sahi Hai | Live Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase CDN Architecture -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <header>
        <div class="logo">📈 Trade Sahi Hai</div>
        <nav class="tab-navigation">
            <button class="nav-btn active" onclick="switchTab('technical')">Technical Analysis</button>
            <button class="nav-btn" onclick="switchTab('fundamental')">Fundamentals</button>
            <button class="nav-btn admin-gateway" onclick="toggleAdminPanel()">🔒 Admin Portal</button>
        </nav>
    </header>

    <div class="container">
        <main class="content-stream">
            <section id="technical-tab" class="tab-panel active">
                <div id="technical-posts-container">
                    <p class="loading-text">Fetching latest cloud data...</p>
                </div>
            </section>

            <section id="fundamental-tab" class="tab-panel">
                <div id="fundamental-posts-container">
                    <p class="loading-text">Fetching latest cloud data...</p>
                </div>
            </section>
        </main>

        <aside id="admin-panel" class="admin-sidebar hidden">
            <div class="admin-wrapper">
                <h3>Admin Authentication</h3>
                <div id="auth-box">
                    <input type="email" id="admin-email" placeholder="Admin Email">
                    <input type="password" id="admin-pass" placeholder="Secure Password">
                    <button class="action-btn positive" onclick="loginAdmin()">Secure Login</button>
                </div>

                <div id="editor-controls" class="hidden">
                    <div class="admin-profile-badge">⚡ Authenticated Session Active</div>
                    <hr class="divider">
                    <h3>Publish New Analysis</h3>
                    <label>Stream Classification</label>
                    <select id="post-category">
                        <option value="technical">Technical Analysis</option>
                        <option value="fundamental">Fundamental Analysis</option>
                    </select>

                    <label>Analysis Heading</label>
                    <input type="text" id="post-title" placeholder="e.g., NIFTY Breakout Confirmation">

                    <label>Chart Graphic (Image URL)</label>
                    <input type="text" id="post-image" placeholder="Paste link to chart image">

                    <label>Strategic Observations & Insights</label>
                    <textarea id="post-body" rows="6" placeholder="Document specific trendlines..."></textarea>

                    <button class="action-btn complete" onclick="publishToCloud()">Publish Live Globally</button>
                    <button class="action-btn negative" onclick="logoutAdmin()">Sign Out</button>
                </div>
            </div>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
